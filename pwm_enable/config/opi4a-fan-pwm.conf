# Configuration for opi4a-fan-pwm.service
# Orange Pi 4A (Allwinner T527) - Pin 7 (PB4 / PWM8) NPN Transistor Fan Control

PWM_DEV_PATTERN="2000c00.pwm"
PWM_CHANNEL=8

# 20 kHz hardware PWM (period in nanoseconds)
PERIOD_NS=50000

# NPN low-side switch: normal polarity (higher duty_cycle = higher fan RPM, 0 = off)
POLARITY="normal"

# Polling interval and hysteresis
POLL_SEC=2
HYSTERESIS_C=3

# Kick-start pulse when starting from 0% duty (2-wire fan startup torque)
KICK_DUTY_NS=30000
KICK_SEC=2

# Temperature thresholds (deg C, across max of all /sys/class/thermal/thermal_zone*)
TEMP_LOW_C=55
TEMP_MID_C=65
TEMP_HIGH_C=73
TEMP_MAX_C=80

# Duty cycles in nanoseconds (out of PERIOD_NS=50000)
DUTY_LOW_NS=20000   # 40%
DUTY_MID_NS=30000   # 60%
DUTY_HIGH_NS=40000  # 80%
DUTY_MAX_NS=50000   # 100%

# Set to 1 to log every poll cycle; 0 logs on duty/tier changes only
VERBOSE=0
